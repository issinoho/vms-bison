UPSTREAM_SHA256=9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2
# Akim Demaille's release signing key (keys/bison-signing-key.asc, from the GNU keyring).
UPSTREAM_GPG_KEY=7DF84374B1EE1F9764BBE25D0DDCAA3278D5264E
# Our patch level on top of the upstream release (3.8.2-vms1)
VMS_PATCH_LEVEL=1
